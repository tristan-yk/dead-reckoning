<!doctype html>
<meta charset="utf-8">
<title>dead reckoning</title>
<style>
  /* The page is exactly one viewport tall and never scrolls: the header and the
     four plots take the height they need, and the 3D stage absorbs whatever is
     left over. */
  html, body { height: 100%; }
  body { margin: 0; background: #14161a; color: #d8dde5;
         font: 13px ui-monospace, Consolas, monospace;
         display: flex; flex-direction: column; overflow: hidden; }
  header { flex: 0 0 auto; display: flex; gap: 22px; align-items: baseline;
           padding: 8px 14px; border-bottom: 1px solid #2a2f38; flex-wrap: wrap; }
  /* Every readout gets a fixed box, sized to its widest possible value, so the
     header never reflows when a value gains or loses a digit or a sign. The
     font is monospace, so 1ch is exactly one digit. */
  header b { color: #fff; font-size: 15px;
             display: inline-block; text-align: right; }
  #state { width: 11ch; text-align: left; }   /* CALIBRATING */
  #rate  { width: 4ch; }                      /* up to 4 digits */
  #alt   { width: 7ch; }                      /* -100.00 */
  #roll, #pitch, #hdg, #amag { width: 6ch; }  /* -180.0 */
  #gate  { width: 5ch; text-align: left; }    /* BLIND */
  .stat span { color: #8a93a3; }
  .anchor { margin-left: auto; display: flex; gap: 8px; align-items: baseline; }
  .anchor input { width: 62px; background: #1b2029; color: #fff; border: 1px solid #2a2f38;
                  padding: 3px 5px; font: inherit; }
  .anchor button { background: #1b2029; color: #d8dde5; border: 1px solid #2a2f38;
                   padding: 3px 8px; font: inherit; cursor: pointer; }
  .anchor button:hover { border-color: #5fd3a0; color: #5fd3a0; }
  /* Absolute inside a relative stage, so the canvas fills exactly what flex
     hands the stage without relying on percentage-height resolution. */
  .stage { flex: 1 1 0; min-height: 0; position: relative;
           border-bottom: 1px solid #2a2f38; }
  #c_3d { position: absolute; inset: 0; width: 100%; height: 100%; }
  .grid { flex: 0 0 auto; display: grid; grid-template-columns: 1fr 1fr;
          gap: 1px; background: #2a2f38; }
  .panel { background: #14161a; padding: 6px 10px 4px; }
  .title { color: #8a93a3; margin-bottom: 3px; }
  .title i { font-style: normal; margin-left: 10px; }
  canvas { width: 100%; height: 150px; display: block; }
</style>

<header>
  <b id="state">--</b>
  <div class="stat"><span>rate</span> <b id="rate">0</b> Hz</div>
  <div class="stat"><span>alt</span> <b id="alt">0.00</b> m</div>
  <div class="stat"><span>roll</span> <b id="roll">0.0</b>&deg;</div>
  <div class="stat"><span>pitch</span> <b id="pitch">0.0</b>&deg;</div>
  <div class="stat"><span>hdg</span> <b id="hdg">0.0</b>&deg;</div>
  <div class="stat"><span>|a|</span> <b id="amag">0.00</b></div>
  <div class="stat"><span>gate</span> <b id="gate">-</b></div>
  <div class="anchor">
    <span style="color:#8a93a3">laptop faces</span>
    <input id="anchor" type="number" step="1" value="0">&deg;
    <button id="grab" title="point the board's +X along the way the screen faces, then click">grab from board</button>
    <label id="smtip"><input id="smooth" type="checkbox" checked> smooth view</label>
  </div>
</header>

<div class="stage"><canvas id="c_3d"></canvas></div>

<div class="grid">
  <div class="panel"><div class="title">altitude &mdash;
      <i style="color:#5fd3a0">filter h</i><i style="color:#c8813f">raw baro</i></div>
    <canvas id="c_alt"></canvas></div>
  <div class="panel"><div class="title">quaternion &mdash;
      <i style="color:#d8dde5">q0</i><i style="color:#e07a5f">q1</i><i style="color:#5fd3a0">q2</i><i style="color:#7aa5e8">q3</i></div>
    <canvas id="c_quat"></canvas></div>
  <div class="panel"><div class="title">vertical &mdash;
      <i style="color:#5fd3a0">v_z m/s</i><i style="color:#c8813f">a_z m/s&sup2;</i></div>
    <canvas id="c_vert"></canvas></div>
  <div class="panel"><div class="title">accel magnitude &mdash;
      <i style="color:#5fd3a0">|a|</i><i style="color:#8a93a3">shaded = inside gate, accel trusted for attitude</i></div>
    <canvas id="c_amag"></canvas></div>
</div>

<script>
const N = 1500;                 // samples held, 15 s at 100 Hz
const G = 9.80665;
const GATE = 0.1;               // must match accel_gate in filter_params.m
const PA_PER_M = 11.98;         // dp/dh near sea level
const ELEV = 20 * Math.PI / 180;   // camera looks down on the scene by this much
const ALT_SPAN = 1.6;           // metres of altitude shown before the board pins

const SMOOTH_TAU = 0.10;        // seconds, 3D view only, never the plots

const buf = [];
let baroRef = null, lastState = null, count = 0, rate = 0;
let last = null;                // most recent sample, for the 3D view
let anchorDeg = 0;              // compass heading the laptop screen faces
let sq = null, sh = 0;          // smoothed quaternion and altitude

function el(id) { return document.getElementById(id); }
setInterval(() => { rate = count; count = 0; el('rate').textContent = rate; }, 1000);

// The anchor is what makes the view convincing: the scene is drawn as if the
// camera were looking along this compass heading, so the grid's north lines up
// with real north as seen from where you are sitting.
try { anchorDeg = parseFloat(localStorage.getItem('anchorDeg')) || 0; } catch (e) {}
el('anchor').value = anchorDeg;
el('anchor').oninput = () => {
  anchorDeg = parseFloat(el('anchor').value) || 0;
  try { localStorage.setItem('anchorDeg', anchorDeg); } catch (e) {}
};
const smoothOn = () => el('smooth').checked;
const viewQ = () => (smoothOn() ? last.qs : last.q);

// Labelled from the constant so the two can never drift apart.
el('smtip').title = 'display only, ' + SMOOTH_TAU.toFixed(2) +
                    ' s — never applied to the plots below';

el('grab').onclick = () => {
  if (!last) return;
  // Smoothed, because this asks "what heading is it pointing right now" and a
  // single noisy sample is the wrong answer to that.
  el('anchor').value = Math.round(quatToEuler(last.qs)[2]);
  el('anchor').oninput();
};

/* ---------- small vector helpers, all arrays of three ---------- */
const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2] - a[2]*b[1], a[2]*b[0] - a[0]*b[2], a[0]*b[1] - a[1]*b[0]];
const add = (a, b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]];
const scl = (a, k) => [a[0]*k, a[1]*k, a[2]*k];

// v_nav = R(q) v_body, Hamilton scalar-first, matching q2dcm.m.
function qrot(q, v) {
  const w = q[0], u = [q[1], q[2], q[3]];
  const t = scl(cross(u, v), 2);
  return add(add(v, scl(t, w)), cross(u, t));
}

// The filter works in NED; the view is NWU, which is the handedness that reads
// naturally on screen (up is up, and the triad is right-handed the usual way).
const toNWU = v => [v[0], -v[1], -v[2]];

function quatToEuler(q) {
  const [w, x, y, z] = q;
  const roll  = Math.atan2(2*(w*x + y*z), 1 - 2*(x*x + y*y));
  let s = 2*(w*y - z*x); s = Math.max(-1, Math.min(1, s));
  const pitch = Math.asin(s);
  const yaw   = Math.atan2(2*(w*z + x*y), 1 - 2*(y*y + z*z));
  const d = 180/Math.PI;
  return [roll*d, pitch*d, (yaw*d + 360) % 360];
}

/* ---------- telemetry ---------- */
new EventSource('/stream').onmessage = (e) => {
  for (const s of JSON.parse(e.data)) {
    if (s.log !== undefined) continue;   // status lines go to the terminal
    count++;

    // The filter captures its reference pressure during calibration, so reset
    // the raw-baro reference whenever a new run starts. Without this the two
    // altitude traces would be offset by whatever the pressure was at boot.
    if (s.state === 2 && lastState !== 2) baroRef = s.baro;
    lastState = s.state;
    if (baroRef === null) baroRef = s.baro;

    const q = [s.q0, s.q1, s.q2, s.q3];
    const [roll, pitch, hdg] = quatToEuler(q);
    const amag = Math.hypot(s.ax, s.ay, s.az);
    // Display-only smoothing, for the 3D view alone. The filter is doing its
    // job; what is left in h and the quaternion is irreducible sensor noise,
    // and a solid object visibly buzzing reads as a fault when it is not. The
    // plots below stay raw so this can never hide what we diagnose with them.
    const a = 1 - Math.exp(-0.01 / SMOOTH_TAU);
    if (sq === null) { sq = q.slice(); sh = s.h; }
    else {
      // q and -q are the same rotation, so align hemispheres before blending;
      // otherwise a sign flip drags the average through zero.
      const t = (sq[0]*q[0] + sq[1]*q[1] + sq[2]*q[2] + sq[3]*q[3] < 0)
                ? q.map(v => -v) : q;
      for (let i = 0; i < 4; i++) sq[i] += a * (t[i] - sq[i]);
      const n = Math.hypot(sq[0], sq[1], sq[2], sq[3]);
      for (let i = 0; i < 4; i++) sq[i] /= n;
      sh += a * (s.h - sh);
    }
    last = { q: q, h: s.h, qs: sq.slice(), hs: sh, state: s.state };
    buf.push({
      q: q, h: s.h, baroAlt: -(s.baro - baroRef) / PA_PER_M,
      roll, pitch, hdg, v_z: s.v_z, a_z: s.a_z, amag,
    });
    if (buf.length > N) buf.shift();

    el('state').textContent = ['IDLE', 'CALIBRATING', 'RUNNING'][s.state] || '?';
    el('alt').textContent = s.h.toFixed(2);
    el('roll').textContent = roll.toFixed(1);
    el('pitch').textContent = pitch.toFixed(1);
    el('hdg').textContent = hdg.toFixed(1);
    el('amag').textContent = amag.toFixed(2);
    const inGate = Math.abs(amag - G) < GATE * G;
    el('gate').textContent = inGate ? 'open' : 'BLIND';
    el('gate').style.color = inGate ? '#5fd3a0' : '#e07a5f';
  }
};

/* ---------- 3D view ---------- */
// Body frame is x forward, y right, z down, so the slab is thin in z and the
// face at -z is the top of the board. The device is 100 x 70 x 25 mm; it is
// drawn at DEV_SCALE times life size because at true scale, against a vertical
// axis spanning metres, it would be a few pixels across.
const DEV_M = [0.100, 0.070, 0.025];
const DEV_SCALE = 11;
const HX = DEV_M[0]/2*DEV_SCALE, HY = DEV_M[1]/2*DEV_SCALE, HZ = DEV_M[2]/2*DEV_SCALE;
const CORNERS = [
  [-HX,-HY,-HZ], [HX,-HY,-HZ], [HX,HY,-HZ], [-HX,HY,-HZ],
  [-HX,-HY, HZ], [HX,-HY, HZ], [HX,HY, HZ], [-HX,HY, HZ],
];
const FACES = [
  { i: [0,1,2,3], c: '#37455a' },   // top, lightened so orientation is readable
  { i: [4,5,6,7], c: '#191d25' },
  { i: [0,1,5,4], c: '#252d3a' }, { i: [2,3,7,6], c: '#252d3a' },
  { i: [1,2,6,5], c: '#252d3a' }, { i: [3,0,4,7], c: '#252d3a' },
];
// The firmware's body frame is forward-right-down, matching its NED nav frame.
// The view is NWU, so the device triad is drawn in the matching body convention,
// forward-left-up: the same [x, -y, -z] flip toNWU applies to the world. Without
// this a level board would init with Z pointing at the floor while the world
// around it had up as positive, which is the two halves disagreeing.
const AXES = [
  { v: [1, 0, 0], c: '#e07a5f', label: 'X' },
  { v: [0,-1, 0], c: '#5fd3a0', label: 'Y' },
  { v: [0, 0,-1], c: '#7aa5e8', label: 'Z' },
];

function camera() {
  const a = anchorDeg * Math.PI / 180;
  const c = [Math.cos(a), -Math.sin(a), 0];        // look direction, NWU
  const f = [c[0]*Math.cos(ELEV), c[1]*Math.cos(ELEV), -Math.sin(ELEV)];
  const r = [c[1], -c[0], 0];                      // screen right, horizontal
  return { f: f, r: r, s: cross(r, f) };           // s is screen up
}

function draw3d() {
  const canvas = el('c_3d');
  const dpr = devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w*dpr) { canvas.width = w*dpr; canvas.height = h*dpr; }
  const g = canvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  g.font = '11px ui-monospace, monospace';

  const cam = camera();
  // Sized so the altitude tape, the tallest thing drawn, just fits: its half
  // height is ALT_SPAN * cos(ELEV) * scale = 0.42h, leaving a small margin
  // above and below the origin at 0.52h.
  const scale = h * 0.28;
  const ox = w*0.5 + 26, oy = h*0.52;
  const P = v => [ox + dot(v, cam.r)*scale, oy - dot(v, cam.s)*scale];
  const line = (a, b) => { const p = P(a), q = P(b);
                           g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); g.stroke(); };

  // ground plane, fixed to true north
  g.lineWidth = 1;
  for (let i = -5; i <= 5; i++) {
    const t = i * 0.3;
    g.strokeStyle = (i === 0) ? '#3a4250' : '#242a33';
    line([t, -1.5, 0], [t, 1.5, 0]);
    line([-1.5, t, 0], [1.5, t, 0]);
  }
  g.fillStyle = '#8a93a3'; g.textAlign = 'center';
  const compass = [['N', [1.75,0,0]], ['E', [0,-1.75,0]], ['S', [-1.75,0,0]], ['W', [0,1.75,0]]];
  for (const [name, v] of compass) { const p = P(v); g.fillText(name, p[0], p[1]+4); }

  const q = last ? viewQ() : [1,0,0,0];
  const alt = last ? (smoothOn() ? last.hs : last.h) : 0;
  const up = Math.max(-ALT_SPAN, Math.min(ALT_SPAN, alt));
  const base = [0, 0, up];

  drawTape(g, P, oy, scale*Math.cos(ELEV), alt, up);

  // drop line, so the board's height above the ground plane is unambiguous
  g.strokeStyle = '#3a4250'; g.setLineDash([3, 3]); line([0,0,0], base); g.setLineDash([]);

  // board, painted far faces first
  const pts = CORNERS.map(c => add(base, toNWU(qrot(q, c))));
  const faces = FACES.map(f => {
    const cen = scl(f.i.reduce((a, i) => add(a, pts[i]), [0,0,0]), 0.25);
    return { f: f, depth: dot(cen, cam.f) };
  }).sort((a, b) => b.depth - a.depth);
  for (const { f } of faces) {
    g.beginPath();
    f.i.forEach((i, k) => { const p = P(pts[i]); k ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); });
    g.closePath();
    g.fillStyle = f.c; g.fill();
    g.strokeStyle = '#4a5468'; g.lineWidth = 1; g.stroke();
  }

  // body triad
  g.lineWidth = 2;
  for (const ax of AXES) {
    const tip = add(base, scl(toNWU(qrot(q, ax.v)), 0.85));
    g.strokeStyle = ax.c; line(base, tip);
    const p = P(tip);
    g.fillStyle = ax.c; g.fillText(ax.label, p[0], p[1] - 5);
  }
  g.textAlign = 'left';
}

function drawTape(g, P, oy, pxPerM, alt, up) {
  const x = 16, top = oy - ALT_SPAN*pxPerM, bot = oy + ALT_SPAN*pxPerM;
  g.strokeStyle = '#2a2f38'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(x, top); g.lineTo(x, bot); g.stroke();
  g.fillStyle = '#8a93a3'; g.textAlign = 'left';
  for (let t = -ALT_SPAN; t <= ALT_SPAN + 1e-6; t += 0.4) {
    const y = oy - t*pxPerM;
    g.beginPath(); g.moveTo(x - 4, y); g.lineTo(x + 4, y); g.stroke();
    g.fillText(t.toFixed(1), x + 8, y + 3);
  }
  const y = oy - up*pxPerM;
  const pinned = Math.abs(alt) > ALT_SPAN;
  g.fillStyle = pinned ? '#c8813f' : '#5fd3a0';
  g.beginPath(); g.moveTo(x - 9, y); g.lineTo(x - 2, y - 4); g.lineTo(x - 2, y + 4);
  g.closePath(); g.fill();
  g.fillText(alt.toFixed(2) + ' m', 4, top - 8);
}

/* ---------- strip charts ---------- */
function draw(canvas, series, opts = {}) {
  const dpr = devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w*dpr) { canvas.width = w*dpr; canvas.height = h*dpr; }
  const g = canvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  if (buf.length < 2) return;

  let lo, hi;
  if (opts.range) {
    [lo, hi] = opts.range;
  } else {
    lo = Infinity; hi = -Infinity;
    for (const s of series) for (const p of buf) {
      const v = s.get(p);
      if (v < lo) lo = v;
      if (v > hi) hi = v;
    }
    if (opts.band) { lo = Math.min(lo, opts.band[0]); hi = Math.max(hi, opts.band[1]); }
    if (!isFinite(lo)) return;
    const pad = (hi - lo) * 0.15 || 0.5;
    lo -= pad; hi += pad;
    // Without a floor on the span, a still board rescales the axis down to its
    // own noise and centimetres get drawn as though they filled the panel,
    // which reads as violent jitter when the trace is physically flat.
    if (opts.minSpan && hi - lo < opts.minSpan) {
      const mid = (lo + hi) / 2;
      lo = mid - opts.minSpan/2; hi = mid + opts.minSpan/2;
    }
  }
  const Y = v => h - (v - lo) / (hi - lo) * h;
  const X = i => i / (N - 1) * w;

  if (opts.band) {                       // gate band, drawn behind the traces
    g.fillStyle = '#5fd3a018';
    g.fillRect(0, Y(opts.band[1]), w, Y(opts.band[0]) - Y(opts.band[1]));
  }
  g.strokeStyle = '#2a2f38'; g.lineWidth = 1;   // zero line
  if (lo < 0 && hi > 0) { g.beginPath(); g.moveTo(0, Y(0)); g.lineTo(w, Y(0)); g.stroke(); }

  for (const s of series) {
    g.strokeStyle = s.color; g.lineWidth = 1.4; g.beginPath();
    buf.forEach((p, i) => i ? g.lineTo(X(i), Y(s.get(p))) : g.moveTo(X(i), Y(s.get(p))));
    g.stroke();
  }
  g.fillStyle = '#8a93a3';
  g.fillText(hi.toFixed(2), 3, 10);
  g.fillText(lo.toFixed(2), 3, h - 3);
}

function frame() {
  draw3d();
  draw(el('c_alt'),  [{get: p => p.h, color: '#5fd3a0'}, {get: p => p.baroAlt, color: '#c8813f'}],
                     {minSpan: 0.5});
  draw(el('c_quat'), [{get: p => p.q[0], color: '#d8dde5'}, {get: p => p.q[1], color: '#e07a5f'},
                      {get: p => p.q[2], color: '#5fd3a0'}, {get: p => p.q[3], color: '#7aa5e8'}],
                     {range: [-1.05, 1.05]});
  draw(el('c_vert'), [{get: p => p.v_z, color: '#5fd3a0'}, {get: p => p.a_z, color: '#c8813f'}],
                     {minSpan: 0.5});
  draw(el('c_amag'), [{get: p => p.amag, color: '#5fd3a0'}], {band: [G*(1-GATE), G*(1+GATE)]});
  requestAnimationFrame(frame);
}
frame();
</script>
